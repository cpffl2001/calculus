<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Wheel: Solve the Puzzle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

:root{
  --navy-950:#0A0F1F;
  --navy-800:#131B32;
  --navy-700:#1C2740;
  --navy-600:#263252;
  --gold:#F2B705;
  --gold-light:#FFE28A;
  --magenta:#FF4D8D;
  --red-soft:#FF6B6B;
  --cream:#F6F1E6;
  --cream-dim:#C9C2AE;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  background:
    radial-gradient(ellipse at top, #17203a 0%, var(--navy-950) 60%);
  color:var(--cream);
  font-family:'Space Grotesk', sans-serif;
  min-height:100vh;
}

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:28px 18px 60px;
}

/* ---------- MARQUEE HEADER ---------- */
.marquee{
  position:relative;
  border:3px solid var(--gold);
  border-radius:14px;
  padding:20px 16px;
  text-align:center;
  background:linear-gradient(180deg, var(--navy-800), var(--navy-700));
  box-shadow:0 0 0 6px var(--navy-950), 0 20px 50px -20px rgba(0,0,0,0.7);
  overflow:hidden;
}
.marquee::before,.marquee::after{
  content:"";
  position:absolute;
  left:8px; right:8px;
  height:10px;
  background-image:radial-gradient(circle, var(--gold) 2.5px, transparent 3px);
  background-size:22px 10px;
  background-repeat:repeat-x;
  opacity:0.85;
  animation:chase 1.4s linear infinite;
}
.marquee::before{ top:6px; }
.marquee::after{ bottom:6px; animation-direction:reverse; }
@keyframes chase{
  0%{background-position-x:0;}
  100%{background-position-x:22px;}
}
.marquee h1{
  font-family:'Bebas Neue', sans-serif;
  letter-spacing:3px;
  font-size:clamp(28px,6vw,44px);
  margin:6px 0 2px;
  color:var(--gold-light);
  text-shadow:0 0 18px rgba(242,183,5,0.45);
}
.marquee p{
  margin:0;
  color:var(--cream-dim);
  font-size:14px;
  letter-spacing:0.5px;
}

/* ---------- STATS BAR ---------- */
.stats{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:20px 0;
  font-family:'IBM Plex Mono', monospace;
}
.stat{
  flex:1;
  background:var(--navy-700);
  border:1px solid var(--navy-600);
  border-radius:10px;
  padding:10px 8px;
  text-align:center;
}
.stat .num{
  font-size:22px;
  font-weight:600;
  color:var(--gold-light);
  display:block;
}
.stat .lbl{
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--cream-dim);
  text-transform:uppercase;
}

/* ---------- PUZZLE BOARD ---------- */
.board{
  background:var(--navy-800);
  border:2px solid var(--navy-600);
  border-radius:14px;
  padding:22px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}
.board-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
}
.tile{
  width:34px;
  height:42px;
  background:var(--navy-600);
  border:1.5px solid var(--navy-950);
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Bebas Neue', sans-serif;
  font-size:22px;
  color:transparent;
  perspective:400px;
}
.tile.revealed{
  background:linear-gradient(180deg, var(--gold-light), var(--gold));
  color:var(--navy-950);
  animation:flip 0.5s ease;
  box-shadow:0 0 16px rgba(242,183,5,0.55);
}
@keyframes flip{
  0%{transform:rotateY(90deg); opacity:0.2;}
  60%{transform:rotateY(-12deg); opacity:1;}
  100%{transform:rotateY(0deg);}
}
@media (max-width:520px){
  .tile{width:24px; height:32px; font-size:16px;}
}

/* ---------- SOLVE PANEL ---------- */
.solve{
  display:flex;
  gap:8px;
  margin:0 auto 26px;
  max-width:520px;
  flex-wrap:wrap;
  justify-content:center;
}
.solve input{
  flex:1;
  min-width:180px;
  background:var(--navy-700);
  border:1.5px solid var(--navy-600);
  border-radius:8px;
  padding:10px 12px;
  color:var(--cream);
  font-family:'Space Grotesk', sans-serif;
  font-size:14px;
}
.solve input:focus{ outline:2px solid var(--gold); }
.solve button{
  background:var(--navy-600);
  border:1.5px solid var(--gold);
  color:var(--gold-light);
  border-radius:8px;
  padding:10px 16px;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  transition:transform .12s ease, background .12s ease;
}
.solve button:hover{ background:var(--navy-600); transform:translateY(-1px); }
.solve-msg{
  width:100%;
  text-align:center;
  font-size:13px;
  min-height:18px;
  color:var(--cream-dim);
}
.solve-msg.bad{ color:var(--red-soft); }
.solve-msg.good{ color:var(--gold-light); }

/* ---------- QUESTION CARD ---------- */
.qcard{
  background:var(--navy-800);
  border:1px solid var(--navy-600);
  border-radius:14px;
  padding:22px;
}
.qcard .eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:2px;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:6px;
}
.qcard h2{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:clamp(18px,3.6vw,22px);
  margin:0 0 18px;
  line-height:1.35;
}
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media (max-width:520px){
  .choices{ grid-template-columns:1fr; }
}
.choice{
  background:var(--navy-700);
  border:1.5px solid var(--navy-600);
  color:var(--cream);
  border-radius:10px;
  padding:13px 14px;
  font-family:'Space Grotesk', sans-serif;
  font-size:14.5px;
  text-align:left;
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.choice:hover:not(:disabled){ border-color:var(--gold); transform:translateY(-1px); }
.choice:disabled{ cursor:default; }
.choice.correct{ background:rgba(242,183,5,0.18); border-color:var(--gold); color:var(--gold-light); }
.choice.wrong{ background:rgba(255,107,107,0.14); border-color:var(--red-soft); color:var(--red-soft); }

.letter-prompt{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gold-light);
  margin:4px 0 12px;
  text-align:center;
}
.letter-grid{
  display:grid;
  grid-template-columns:repeat(9, 1fr);
  gap:6px;
  max-width:520px;
  margin:0 auto;
}
@media (max-width:520px){
  .letter-grid{ grid-template-columns:repeat(6, 1fr); }
}
.letter-btn{
  aspect-ratio:1;
  background:var(--navy-700);
  border:1.5px solid var(--navy-600);
  color:var(--cream);
  border-radius:8px;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.letter-btn:hover:not(:disabled){ border-color:var(--gold); transform:translateY(-1px); }
.letter-btn:disabled{ opacity:0.3; cursor:default; }
.letter-btn.hit{ background:rgba(242,183,5,0.25); border-color:var(--gold); color:var(--gold-light); }
.letter-btn.miss{ background:rgba(255,107,107,0.14); border-color:var(--red-soft); color:var(--red-soft); }
.letter-result{
  text-align:center;
  font-size:13px;
  min-height:18px;
  margin-top:10px;
  color:var(--cream-dim);
}

.qfoot{
  display:flex;
  justify-content:flex-end;
  margin-top:18px;
}
.next-btn{
  background:var(--gold);
  color:var(--navy-950);
  border:none;
  border-radius:8px;
  padding:11px 22px;
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease;
}
.next-btn.show{ opacity:1; pointer-events:auto; }

/* ---------- END SCREEN ---------- */
.end{
  text-align:center;
  padding:10px 4px 4px;
}
.end h2{
  font-family:'Bebas Neue', sans-serif;
  font-size:clamp(30px,7vw,46px);
  color:var(--gold-light);
  letter-spacing:2px;
  margin:6px 0;
}
.end p{ color:var(--cream-dim); margin:4px 0 18px; }
.restart-btn{
  background:var(--navy-600);
  border:1.5px solid var(--gold);
  color:var(--gold-light);
  border-radius:9px;
  padding:12px 24px;
  font-weight:700;
  font-family:'Space Grotesk', sans-serif;
  cursor:pointer;
}

.hidden{ display:none !important; }

footer{
  text-align:center;
  color:var(--cream-dim);
  font-size:11px;
  margin-top:26px;
  letter-spacing:0.5px;
}
</style>
</head>
<body>

<div class="wrap">

  <div class="marquee">
    <h1>Trivia Wheel</h1>
    <p>Answer correctly &middot; guess a letter &middot; solve the puzzle</p>
  </div>

  <div class="stats">
    <div class="stat"><span class="num" id="statScore">0</span><span class="lbl">Score</span></div>
    <div class="stat"><span class="num" id="statQ">1 / 28</span><span class="lbl">Question</span></div>
    <div class="stat"><span class="num" id="statCorrect">0</span><span class="lbl">Correct</span></div>
  </div>

  <div class="board" id="board"></div>

  <div class="solve">
    <input type="text" id="solveInput" placeholder="Guess the full puzzle...">
    <button id="solveBtn">Solve Puzzle</button>
    <div class="solve-msg" id="solveMsg"></div>
  </div>

  <div class="qcard" id="qcard">
    <div class="eyebrow">Category: Pop Culture &amp; Internet Slang</div>
    <h2 id="qtext"></h2>
    <div class="choices" id="choices"></div>
    <div id="letterSection" class="hidden">
      <div class="letter-prompt">Correct! Pick a letter to place on the board</div>
      <div class="letter-grid" id="letterGrid"></div>
      <div class="letter-result" id="letterResult"></div>
    </div>
    <div class="qfoot">
      <button class="next-btn" id="nextBtn">Next Question &rarr;</button>
    </div>
  </div>

  <div class="qcard end hidden" id="endCard">
    <div class="eyebrow">Game Over</div>
    <h2 id="endTitle">SOLVED!</h2>
    <p id="endSub"></p>
    <button class="restart-btn" id="restartBtn">Play Again</button>
  </div>

  <footer>Built for classroom play &middot; get a question right, then call a letter for the board</footer>
</div>

<script>
const PUZZLE_WORDS = ["SOMBRILLA", "FOUNTAIN"];
const LETTER_SEQUENCE = PUZZLE_WORDS.join("").split(""); // 17 letters, revealed in this order

const RAW_QUESTIONS = [
  { q:"Who played Rachel Green on Friends?", a:"Jennifer Aniston", d:["Courteney Cox","Lisa Kudrow","Reese Witherspoon"] },
  { q:"The Office is set in which city?", a:"Scranton, Pennsylvania", d:["Albany, New York","Pittsburgh, Pennsylvania","Trenton, New Jersey"] },
  { q:"Which pop star famously wore a meat dress to the 2010 MTV Video Music Awards?", a:"Lady Gaga", d:["Katy Perry","Madonna","Rihanna"] },
  { q:"Who voices Woody in Toy Story?", a:"Tom Hanks", d:["Tim Allen","Billy Crystal","John Ratzenberger"] },
  { q:"Who played Jack in Titanic?", a:"Leonardo DiCaprio", d:["Brad Pitt","Matt Damon","Matthew McConaughey"] },
  { q:"What's the highest-grossing film of all time (as of 2025)?", a:"Avatar", d:["Avengers: Endgame","Titanic","Star Wars: The Force Awakens"] },
  { q:"Who directed Jurassic Park?", a:"Steven Spielberg", d:["James Cameron","George Lucas","Ridley Scott"] },
  { q:"What is the name of the main wizarding school in Harry Potter?", a:"Hogwarts", d:["Beauxbatons","Durmstrang","Ilvermorny"] },
  { q:"What color is the lightsaber used by Yoda?", a:"Green", d:["Blue","Red","Purple"] },
  { q:"The Beatles were formed in what city?", a:"Liverpool", d:["London","Manchester","Birmingham"] },
  { q:"Who sings \u201cSingle Ladies (Put a Ring on It)\u201d?", a:"Beyonc\u00e9", d:["Rihanna","Alicia Keys","Whitney Houston"] },
  { q:"What band sang \u201cBohemian Rhapsody\u201d?", a:"Queen", d:["The Beatles","Led Zeppelin","Pink Floyd"] },
  { q:"Taylor Swift's fan base is known as what?", a:"Swifties", d:["Directioners","Beliebers","Little Monsters"] },
  { q:"Who played Iron Man in the Marvel films?", a:"Robert Downey Jr.", d:["Chris Evans","Chris Hemsworth","Mark Ruffalo"] },
  { q:"Which actor starred as Jack Sparrow in Pirates of the Caribbean?", a:"Johnny Depp", d:["Orlando Bloom","Geoffrey Rush","Javier Bardem"] },
  { q:"Which actor voiced Donkey in Shrek?", a:"Eddie Murphy", d:["Mike Myers","Chris Rock","Martin Lawrence"] },
  { q:"What year was YouTube founded?", a:"2005", d:["2003","2006","2008"] },
  { q:"Who painted the Mona Lisa?", a:"Leonardo da Vinci", d:["Michelangelo","Raphael","Vincent van Gogh"] },
  { q:"Which planet is known as the Red Planet?", a:"Mars", d:["Venus","Jupiter","Saturn"] },
  { q:"Where was The Lord of the Rings movie trilogy filmed?", a:"New Zealand", d:["Iceland","Scotland","Australia"] },
  { q:"What does the acronym NGL stand for?", a:"Not Gonna Lie", d:["Need Google Login","No Going Left","Never Gets Lonely"] },
  { q:"What does the acronym IJBOL stand for?", a:"I Just Burst Out Laughing", d:["I Just Broke One Lamp","It Just Became Obvious","I Just Bought One Lollipop"] },
  { q:"What does the acronym SMH stand for?", a:"Shaking My Head", d:["So Much Hype","Send Me Home","Seriously Missing Him"] },
  { q:"What does the acronym ICYMI stand for?", a:"In Case You Missed It", d:["I Can't, You Might","It's Cool, You're Mine","If Course You Might"] },
  { q:"What does TL;DR stand for?", a:"Too Long, Didn't Read", d:["The Link Doesn't Run","Talk Less, Do Right","Try Later, Do Return"] },
  { q:"What does the acronym BAE stand for?", a:"Before Anyone Else", d:["Best At Everything","By All Estimates","Back At Eight"] },
  { q:"What does the acronym TNTL stand for?", a:"Trying Not To Laugh", d:["Try Not To Look","Time Never Truly Lasts","Totally Not The Last"] },
  { q:"What does the acronym FOMO stand for?", a:"Fear Of Missing Out", d:["Feeling Okay, Mostly Ok","Fun Over Money, Often","Focus On My Own"] }
];

const UNIQUE_LETTERS = [...new Set(LETTER_SEQUENCE)]; // letters actually in the puzzle
const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

let questions = [];
let order = [];
let currentIndex = 0;
let score = 0;
let correctCount = 0;
let revealedLetters = new Set();  // letters confirmed to be on the board
let guessedLetters = new Set();   // every letter already picked (hit or miss)
let answeredCurrent = false;
let awaitingLetterGuess = false;
let solved = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQuestions(){
  questions = RAW_QUESTIONS.map(item=>{
    const choices = shuffle([item.a, ...item.d]);
    return { text:item.q, answer:item.a, choices };
  });
  order = shuffle(questions.map((_,i)=>i));
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  PUZZLE_WORDS.forEach(word=>{
    const row = document.createElement('div');
    row.className = 'board-row';
    for(let i=0;i<word.length;i++){
      const tile = document.createElement('div');
      tile.className = 'tile';
      const letter = word[i];
      if(revealedLetters.has(letter)){
        tile.classList.add('revealed');
        tile.textContent = letter;
      }
      row.appendChild(tile);
    }
    board.appendChild(row);
  });
}

function puzzleComplete(){
  return UNIQUE_LETTERS.every(l => revealedLetters.has(l));
}

function renderStats(){
  document.getElementById('statScore').textContent = score;
  document.getElementById('statQ').textContent = Math.min(currentIndex+1, questions.length) + ' / ' + questions.length;
  document.getElementById('statCorrect').textContent = correctCount;
}

function renderQuestion(){
  answeredCurrent = false;
  awaitingLetterGuess = false;
  const qIndex = order[currentIndex];
  const q = questions[qIndex];
  document.getElementById('qtext').textContent = q.text;
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  choicesEl.classList.remove('hidden');
  q.choices.forEach(choiceText=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choiceText;
    btn.addEventListener('click', ()=>handleAnswer(btn, choiceText, q.answer));
    choicesEl.appendChild(btn);
  });
  document.getElementById('letterSection').classList.add('hidden');
  document.getElementById('letterResult').textContent = '';
  document.getElementById('nextBtn').classList.remove('show');
  renderStats();
}

function handleAnswer(btn, chosen, correctAnswer){
  if(answeredCurrent || solved) return;
  answeredCurrent = true;
  const allBtns = document.querySelectorAll('.choice');
  allBtns.forEach(b=>{
    b.disabled = true;
    if(b.textContent === correctAnswer) b.classList.add('correct');
  });
  if(chosen !== correctAnswer){
    btn.classList.add('wrong');
    renderStats();
    document.getElementById('nextBtn').classList.add('show');
    return;
  }
  correctCount++;
  score += 10;
  renderStats();
  if(guessedLetters.size >= 26 || puzzleComplete()){
    // nothing left worth guessing - just move on
    document.getElementById('nextBtn').classList.add('show');
    return;
  }
  awaitingLetterGuess = true;
  document.getElementById('choices').classList.add('hidden');
  document.getElementById('letterSection').classList.remove('hidden');
  renderLetterGrid();
}

function renderLetterGrid(){
  const grid = document.getElementById('letterGrid');
  grid.innerHTML = '';
  ALPHABET.forEach(letter=>{
    const btn = document.createElement('button');
    btn.className = 'letter-btn';
    btn.textContent = letter;
    if(guessedLetters.has(letter)) btn.disabled = true;
    btn.addEventListener('click', ()=>handleLetterGuess(letter, btn));
    grid.appendChild(btn);
  });
}

function handleLetterGuess(letter, btn){
  if(!awaitingLetterGuess || guessedLetters.has(letter)) return;
  awaitingLetterGuess = false;
  guessedLetters.add(letter);
  document.querySelectorAll('.letter-btn').forEach(b=>{ if(b !== btn) b.disabled = true; });
  const resultEl = document.getElementById('letterResult');
  if(UNIQUE_LETTERS.includes(letter) && !revealedLetters.has(letter)){
    const occurrences = LETTER_SEQUENCE.filter(l => l === letter).length;
    revealedLetters.add(letter);
    score += occurrences * 5;
    btn.classList.add('hit');
    resultEl.textContent = '"' + letter + '" is on the board! (' + occurrences + (occurrences>1?' spots':' spot') + ', +' + (occurrences*5) + ' pts)';
    resultEl.className = 'letter-result';
    renderBoard();
    renderStats();
    if(puzzleComplete()){
      document.getElementById('nextBtn').classList.add('show');
      setTimeout(()=>endGame(false), 400);
      return;
    }
  } else {
    btn.classList.add('miss');
    resultEl.textContent = '"' + letter + '" is not on the board.';
  }
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  if(solved) return;
  currentIndex++;
  if(currentIndex >= order.length){
    endGame(false);
    return;
  }
  renderQuestion();
}

function normalize(str){
  return str.toUpperCase().replace(/[^A-Z]/g,'');
}

function attemptSolve(){
  if(solved) return;
  const input = document.getElementById('solveInput');
  const msg = document.getElementById('solveMsg');
  const guess = normalize(input.value);
  const target = normalize(PUZZLE_WORDS.join(''));
  if(guess.length === 0){
    msg.textContent = 'Type a guess first.';
    msg.className = 'solve-msg bad';
    return;
  }
  if(guess === target){
    const remaining = UNIQUE_LETTERS.filter(l => !revealedLetters.has(l)).length;
    const bonus = remaining > 0 ? remaining * 10 : 15;
    score += bonus;
    UNIQUE_LETTERS.forEach(l => revealedLetters.add(l));
    renderBoard();
    msg.textContent = 'Correct! Bonus +' + bonus + ' points.';
    msg.className = 'solve-msg good';
    endGame(true);
  } else {
    msg.textContent = 'Not quite - keep answering questions to reveal more letters.';
    msg.className = 'solve-msg bad';
  }
}

function endGame(solvedEarly){
  solved = true;
  document.getElementById('qcard').classList.add('hidden');
  const endCard = document.getElementById('endCard');
  endCard.classList.remove('hidden');
  document.getElementById('endTitle').textContent = puzzleComplete() ? 'PUZZLE SOLVED!' : 'GAME OVER';
  document.getElementById('endSub').textContent =
    'Final score: ' + score + ' \u00b7 ' + correctCount + ' of ' + questions.length + ' correct \u00b7 Answer: ' + PUZZLE_WORDS.join(' ');
  renderStats();
}

function restart(){
  currentIndex = 0;
  score = 0;
  correctCount = 0;
  revealedLetters = new Set();
  guessedLetters = new Set();
  awaitingLetterGuess = false;
  solved = false;
  document.getElementById('solveInput').value = '';
  document.getElementById('solveMsg').textContent = '';
  document.getElementById('solveMsg').className = 'solve-msg';
  document.getElementById('endCard').classList.add('hidden');
  document.getElementById('qcard').classList.remove('hidden');
  buildQuestions();
  renderBoard();
  renderQuestion();
}

document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('solveBtn').addEventListener('click', attemptSolve);
document.getElementById('solveInput').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptSolve(); });
document.getElementById('restartBtn').addEventListener('click', restart);

buildQuestions();
renderBoard();
renderQuestion();
</script>

</body>
</html>
