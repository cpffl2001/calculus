<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The +C Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
/* Layout: projector-first three-column table (Fellowship | turn stage | Fellowship), stacking on narrow screens */
:root {
  --bg: #f7f1ec;
  --surface: #fffdfb;
  --sunk: #efe6df;
  --ink: #2a1a14;
  --muted: #76655c;
  --line: #ddcfc6;
  --ember: #c9861f;
  --ember-soft: #fbedd4;
  --flame: #d4582a;
  --flame-soft: #f9dfd2;
  --inferno: #9e1f1f;
  --inferno-soft: #f3d5d1;
  --camp: #3e7b5a;
  --camp-soft: #dcefe4;
  --sky: #3a6e9a;
  --sky-soft: #dbe8f3;
  --good: #2f7a4f;
  --bad: #b3261e;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --math: "Cambria Math", "STIX Two Math", Cambria, Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1311; --surface: #261a17; --sunk: #1f1513; --ink: #f4e9e2; --muted: #b9a59a; --line: #45332d;
    --ember: #f0b14e; --ember-soft: #3a2a14; --flame: #f07a4a; --flame-soft: #3d2017;
    --inferno: #f06a5f; --inferno-soft: #3d1816; --camp: #6cc196; --camp-soft: #173226;
    --sky: #7fb3e0; --sky-soft: #172a3b; --good: #6cc196; --bad: #ff8a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--flame); outline-offset: 2px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--flame); padding-bottom: 12px; margin-bottom: 18px; }
header.top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4vw, 42px); margin: 0; letter-spacing: -0.01em; }
header.top h1 span { color: var(--flame); }
header.top .tag { color: var(--muted); font-size: 15px; }
header.top .spacer { flex: 1; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 12px; border-radius: 8px; background: var(--sunk); }
.clock.low { color: var(--bad); }

.btn { border: 2px solid var(--ink); background: var(--surface); padding: 9px 16px; border-radius: 10px; font-weight: 700; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 14px; border-width: 1.5px; }
.btn.quiet { border-color: var(--line); color: var(--muted); }

/* setup */
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.fs-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.fs-card h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
label.lbl { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
input[type=text] { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--bg); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
.seg button.on.burn { background: var(--inferno); color: #fff; }
.seg button.on.safe { background: var(--camp); color: #fff; }
.prow { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 8px; align-items: center; }
.prow .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 520px) { .prow { grid-template-columns: 24px 1fr auto; } .prow .seg { grid-column: 2 / 3; grid-row: 2; justify-self: start; } }
.preview { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.preview b { font-weight: 700; }
.setup-foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
.err { color: var(--bad); font-weight: 700; }
.intro { max-width: 70ch; color: var(--muted); margin: 0 0 18px; }

/* play */
.table { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2.1fr) minmax(220px, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .table { grid-template-columns: 1fr 1fr; } .stage { grid-column: 1 / -1; order: -1; } }
@media (max-width: 620px) { .table { grid-template-columns: 1fr; } }
.team { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.team.active { border-color: var(--flame); box-shadow: 0 0 0 3px var(--flame-soft); }
.team h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; overflow-wrap: anywhere; }
.team .meta { font-size: 14px; color: var(--muted); margin: 2px 0 10px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; }
.pill.rescue { background: var(--inferno-soft); color: var(--inferno); }
.pill.defend { background: var(--camp-soft); color: var(--camp); }
.pill.won { background: var(--camp); color: #fff; }
.pill.lost { background: var(--inferno); color: #fff; }
.zone-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); margin: 10px 0 5px; }
.plist { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 10px; border-radius: 99px; font-size: 15px; font-weight: 700; border: 1.5px solid transparent; overflow-wrap: anywhere; }
.chip.camp { background: var(--camp-soft); color: var(--camp); }
.chip.fire { background: var(--inferno-soft); color: var(--inferno); }
.chip.singed { background: var(--ember-soft); color: var(--ember); border-style: dashed; border-color: var(--ember); }
.chip.done { opacity: .6; }
.empty { color: var(--muted); font-size: 14px; font-style: italic; }
.firebar { display: flex; gap: 4px; margin-top: 10px; }
.firebar i { flex: 1; height: 8px; border-radius: 4px; background: var(--camp); }
.firebar i.f { background: var(--inferno); }

.stage { background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 20px; min-width: 0; }
.stage h2 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3vw, 32px); margin: 0 0 4px; text-wrap: balance; }
.stage .sub { color: var(--muted); margin: 0 0 16px; }
.step-lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 14px 0 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 2px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.choice.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.piles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pile { border: 2px solid; border-radius: 12px; padding: 12px; text-align: left; background: var(--surface); display: grid; gap: 2px; }
.pile .t { font-weight: 700; letter-spacing: .08em; }
.pile .r { font-size: 14px; color: var(--muted); }
.pile.EMBER { border-color: var(--ember); } .pile.EMBER .t { color: var(--ember); } .pile.EMBER.on { background: var(--ember-soft); box-shadow: 0 0 0 3px var(--ember); }
.pile.FLAME { border-color: var(--flame); } .pile.FLAME .t { color: var(--flame); } .pile.FLAME.on { background: var(--flame-soft); box-shadow: 0 0 0 3px var(--flame); }
.pile.INFERNO { border-color: var(--inferno); } .pile.INFERNO .t { color: var(--inferno); } .pile.INFERNO.on { background: var(--inferno-soft); box-shadow: 0 0 0 3px var(--inferno); }
.pile:disabled { opacity: .35; }
@media (max-width: 520px) { .piles { grid-template-columns: 1fr; } }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }

.card { border-radius: 14px; border: 3px solid var(--tier); overflow: hidden; margin: 6px 0 14px; background: var(--surface); }
.card .band { background: var(--tier); color: #fff; padding: 8px 14px; display: flex; justify-content: space-between; font-weight: 700; letter-spacing: .06em; }
.card .body { padding: 22px 18px; text-align: center; }
.card .q { font-family: var(--math); font-size: clamp(26px, 3.6vw, 40px); line-height: 1.3; }
.card .q.long { font-size: clamp(20px, 2.6vw, 28px); }
.card .g { font-family: var(--math); font-size: clamp(20px, 2.6vw, 28px); margin-top: 10px; }
.card .g i { font-size: .75em; color: var(--muted); }
.card .foot { background: var(--sunk); padding: 7px 14px; font-size: 14px; text-align: center; }
.EMBERc { --tier: var(--ember); } .FLAMEc { --tier: var(--flame); } .INFERNOc { --tier: var(--inferno); }
.timer { font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 700; font-family: var(--body); }
.timer.out { color: var(--bad); }
.steps4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 14px; margin-bottom: 14px; }
.steps4 div { background: var(--sunk); border-radius: 8px; padding: 6px 8px; }
@media (max-width: 620px) { .steps4 { grid-template-columns: 1fr 1fr; } }
.answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.ansbox { background: var(--sunk); border-radius: 12px; padding: 12px; }
.ansbox input[type=text] { font-size: 22px; font-family: var(--math); }
.check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-weight: 700; color: var(--inferno); }
.check input { width: 20px; height: 20px; accent-color: var(--inferno); }
.hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

.verdict { font-family: var(--display); font-size: clamp(26px, 3.4vw, 36px); margin: 0 0 6px; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.reveal { background: var(--sunk); border-radius: 12px; padding: 12px 14px; font-family: var(--math); font-size: 20px; }
.moves { border: 2.5px dashed var(--flame); border-radius: 12px; padding: 12px 16px; margin-top: 14px; }
.moves h4 { margin: 0 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--flame); }
.moves ul { margin: 0; padding-left: 20px; font-size: 19px; }
.moves li { margin: 3px 0; }
.event { text-align: center; padding: 10px 0 4px; }
.event .big { font-family: var(--display); font-size: clamp(32px, 4.4vw, 48px); }
.event.flare .big { color: var(--inferno); } .event.bucket .big { color: var(--sky); }
.event p { max-width: 52ch; margin: 8px auto; font-size: 19px; }

.log { margin-top: 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.log summary { cursor: pointer; font-weight: 700; }
.log ol { margin: 8px 0 0; padding-left: 22px; font-size: 15px; color: var(--muted); max-height: 260px; overflow: auto; }

.modal-back { position: fixed; inset: 0; background: rgba(20,10,8,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 16px; padding: 20px; max-width: 520px; width: 100%; border: 2px solid var(--ink); }
.modal h3 { font-family: var(--display); font-weight: 400; margin: 0 0 4px; font-size: 24px; }
.modal p { margin: 0 0 12px; color: var(--muted); }

.over { text-align: center; }
.over .res { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; margin: 18px 0; }
.over .res div { background: var(--sunk); border-radius: 12px; padding: 16px; }
.over .res h3 { font-family: var(--display); font-weight: 400; margin: 0 0 6px; font-size: 24px; }
@media (prefers-reduced-motion: no-preference) { .verdict, .event .big { animation: pop .35s ease-out; } @keyframes pop { from { transform: scale(.9); opacity: .4; } to { transform: none; opacity: 1; } } }

.fs-card.solo { max-width: 900px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.table.solo { grid-template-columns: minmax(240px, 1fr) minmax(0, 2.4fr); }
@media (max-width: 1000px) { .table.solo { grid-template-columns: 1fr; } }
.vs { color: var(--flame); font-weight: 700; }
.fs-card h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
.sug { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--ember-soft); border: 2px solid var(--ember); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.sug.ok { background: var(--camp-soft); border-color: var(--camp); color: var(--ink); display: block; }
.already { margin-top: 10px; }
.shield { margin-top: 10px; background: var(--sky-soft); color: var(--sky); border: 2px solid var(--sky); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 14px; }
.waitroom { text-align: center; justify-items: center; }
.waitroom h2 { font-size: clamp(24px, 3vw, 32px); text-wrap: balance; }
.waitroom .opp { color: var(--flame); }
.waitroom .preview, .waitroom #waitsugs { width: 100%; text-align: left; }
.waitroom .setup-foot { width: 100%; }
.campfire { position: relative; width: 120px; height: 110px; margin: 6px auto 0; }
.campfire::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 16px; border-radius: 8px; background: repeating-linear-gradient(90deg, #6b4423 0 22px, #4a2e17 22px 26px); }
.campfire i { position: absolute; bottom: 10px; left: 50%; width: 46px; height: 80px; margin-left: -23px; border-radius: 50% 50% 35% 35% / 65% 65% 35% 35%;
  background: radial-gradient(ellipse at 50% 80%, #fff3b0 0%, #ffb347 35%, #ff6a2b 65%, transparent 72%); transform-origin: 50% 100%; animation: lick 1s ease-in-out infinite alternate; }
.campfire i:nth-child(2) { margin-left: -42px; height: 58px; animation-delay: -.4s; }
.campfire i:nth-child(3) { margin-left: -4px; height: 64px; animation-delay: -.7s; }
@keyframes lick { from { transform: scaleY(.85) skewX(-6deg); } to { transform: scaleY(1.1) skewX(6deg); } }
@media (prefers-reduced-motion: reduce) { .campfire i { animation: none; } }
.choice small { font-weight: 400; color: var(--muted); }
.handoff { background: var(--inferno); color: #fff; font-weight: 700; font-size: 18px; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; text-align: center; }
.relay { font-size: 13px; font-weight: 700; color: var(--muted); }
.relay.ok { color: var(--good); } .relay.limit, .relay.err { color: var(--ember); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal-root"></div>
<script>
"use strict";
const CARDS = [
  { id: 1,  tier: "EMBER", q: "f′(x) = 6x", g: "f(0) = 4", f: "f(x) = 3x² + 4", C: 4 },
  { id: 2,  tier: "EMBER", q: "f′(x) = 4x<sup>3</sup>", g: "f(1) = 7", f: "f(x) = x⁴ + 6", C: 6 },
  { id: 3,  tier: "EMBER", q: "f′(x) = 2x + 5", g: "f(1) = 10", f: "f(x) = x² + 5x + 4", C: 4 },
  { id: 4,  tier: "EMBER", q: "f′(x) = 3x<sup>2</sup> − 4", g: "f(2) = 5", f: "f(x) = x³ − 4x + 5", C: 5 },
  { id: 5,  tier: "EMBER", q: "f′(x) = 10", g: "f(3) = 26", f: "f(x) = 10x − 4", C: -4 },
  { id: 6,  tier: "EMBER", q: "f′(x) = 8x<sup>3</sup> − 6x", g: "f(−1) = 3", f: "f(x) = 2x⁴ − 3x² + 4", C: 4 },
  { id: 7,  tier: "EMBER", q: "f′(x) = x<sup>2</sup> + 1", g: "f(3) = 15", f: "f(x) = x³/3 + x + 3", C: 3 },
  { id: 8,  tier: "EMBER", q: "f′(x) = 12x<sup>2</sup> − 2x + 1", g: "f(0) = −5", f: "f(x) = 4x³ − x² + x − 5", C: -5 },
  { id: 9,  tier: "FLAME", q: "f′(x) = 3√x", g: "f(4) = 20", f: "f(x) = 2x<sup>3/2</sup> + 4", C: 4 },
  { id: 10, tier: "FLAME", q: "f′(x) = 1/x<sup>2</sup>, &nbsp;x &gt; 0", g: "f(1) = 3", f: "f(x) = −1/x + 4", C: 4 },
  { id: 11, tier: "FLAME", q: "f′(x) = e<sup>x</sup>", g: "f(0) = 6", f: "f(x) = e<sup>x</sup> + 5", C: 5 },
  { id: 12, tier: "FLAME", q: "f′(x) = 2/x, &nbsp;x &gt; 0", g: "f(1) = −3", f: "f(x) = 2 ln x − 3", C: -3 },
  { id: 13, tier: "FLAME", q: "f′(x) = cos x", g: "f(0) = 2", f: "f(x) = sin x + 2", C: 2 },
  { id: 14, tier: "FLAME", q: "f′(x) = sin x", g: "f(0) = 4", f: "f(x) = −cos x + 5", C: 5 },
  { id: 15, tier: "FLAME", q: "f′(x) = 4e<sup>x</sup> − 2x", g: "f(0) = 1", f: "f(x) = 4e<sup>x</sup> − x² − 3", C: -3 },
  { id: 16, tier: "FLAME", q: "f′(x) = 1/√x", g: "f(9) = 10", f: "f(x) = 2√x + 4", C: 4 },
  { id: 17, tier: "INFERNO", q: "f′(x) = (x + 1)(x − 1)", g: "f(3) = 10", f: "f(x) = x³/3 − x + 4", C: 4 },
  { id: 18, tier: "INFERNO", q: "f′(x) = (x<sup>2</sup> + 3) / x<sup>2</sup>, &nbsp;x &gt; 0", g: "f(1) = 2", f: "f(x) = x − 3/x + 4", C: 4 },
  { id: 19, tier: "INFERNO", q: "f′(x) = e<sup>2x</sup>", g: "f(0) = 3", f: "f(x) = ½e<sup>2x</sup> + 5/2", C: 2.5 },
  { id: 20, tier: "INFERNO", q: "f′(x) = cos(3x)", g: "f(0) = −1", f: "f(x) = ⅓ sin(3x) − 1", C: -1 },
  { id: 21, tier: "INFERNO", q: "f′(x) = (2x + 1)<sup>2</sup>", g: "f(0) = 6", f: "f(x) = (4/3)x³ + 2x² + x + 6", C: 6,
    alt: { C: 35 / 6, f: "f(x) = (1/6)(2x + 1)³ + 35/6", show: "35/6", how: "substitution (u = 2x + 1)" }, how: "expanding first" },
  { id: 22, tier: "INFERNO", long: true, q: "Bacteria grow at P′(t) = 200e<sup>0.5t</sup> cells per hour.", g: "P(0) = 1000. Find P(t).", f: "P(t) = 400e<sup>0.5t</sup> + 600", C: 600 },
  { id: 23, tier: "INFERNO", long: true, q: "A seedling grows at h′(t) = 1.5√t cm per week.", g: "h(0) = 2 cm. Find h(t).<br><i>Bonus: how tall at week 4? (10 cm)</i>", f: "h(t) = t<sup>3/2</sup> + 2", C: 2 },
  { id: 24, tier: "INFERNO", long: true, q: "A drug leaves the blood at A′(t) = −6e<sup>−0.3t</sup> mg per hour.", g: "A(0) = 25 mg. Find A(t).<br><i>Bonus: what level does A approach? (5 mg)</i>", f: "A(t) = 20e<sup>−0.3t</sup> + 5", C: 5 },
];
const EVENTS = ["FLARE", "FLARE", "BUCKET", "BUCKET"];
const RESCUE_PAY = { EMBER: 1, FLAME: 2, INFERNO: 3 };
const DEFEND_ORDER = ["EMBER", "EMBER", "FLAME", "FLAME", "INFERNO"];
const CARDS_PER_GAME = 5;   /* every Fellowship answers exactly 5 problem cards (Flare-Ups and Bucket Brigades are extra) */
const TIER_NOTE = {
  rescue: { EMBER: "Correct: rescue 1 · Miss: singed", FLAME: "Correct: rescue 2 · Miss: singed", INFERNO: "Correct: rescue 3 · Miss: you fall in" },
  defend: { EMBER: "Correct: stay in Camp · Miss: into the fire", FLAME: "Correct: stay in Camp · Miss: into the fire", INFERNO: "Correct: pull 1 out · Miss: you + 1 more fall in" },
};

const RELAY = "https://ntfy.sh/";
function topicFor(code) { return "cpffl2001-plusc-" + String(code).toLowerCase().replace(/[^a-z0-9]/g, ""); }
const KEY = "plusC-fellowship-v2";

/* ------------------------------------------------------------------ */
/* STATE: one Fellowship per device                                   */
/* ------------------------------------------------------------------ */
let S = null;
let timerHandle = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const card = id => CARDS.find(c => c.id === id);
const newId = () => Math.random().toString(36).slice(2, 10);

function freshSetup(prev) {
  return {
    phase: "setup", id: newId(), code: prev ? prev.code : "", name: prev ? prev.name : "", opp: prev ? prev.opp : "",
    lost: prev ? prev.lost : false,
    players: prev ? prev.players.map(p => ({ name: p.name, status: "camp" })) : Array.from({ length: 5 }, () => ({ name: "", status: "camp" })),
    error: "",
  };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }

const campName = () => S.lost ? "Losers' Camp" : "Winners' Camp";
function missionOf() { return S.players.some(p => p.status === "fire") ? "rescue" : "defend"; }
const inFire = () => S.players.filter(p => p.status === "fire");
const inCamp = () => S.players.filter(p => p.status === "camp");
const idxWhere = f => S.players.map((p, i) => i).filter(i => f(S.players[i]));
const burnLimit = () => Math.floor(S.players.length / 2) + 1;
function log(msg) { S.log.push(msg); S.last = msg; }

/* ------------------------------------------------------------------ */
/* LIVE LEADERBOARD: same relay pattern as the Calculus OR game        */
/* ------------------------------------------------------------------ */
function broadcast() {
  if (!S || !S.code || S.phase === "setup") return;
  const msg = JSON.stringify({
    id: S.id, fs: S.name, opp: S.opp, lost: S.lost, mission: S.mission, result: S.result, ready: S.phase === "waiting",
    p: S.players.map(p => [p.name, p.status === "fire" ? 1 : 0, p.singed > 0 ? 1 : 0]),
    b0: S.b0 || 0, sh: S.shield || 0, rt: S.resultAt || 0, end: S.endBy || "", ans: S.stats.answered, ok: S.stats.correct, di: S.defendIdx, last: S.last || "", t: Date.now(),
  });
  const send = tries => fetch(RELAY + topicFor(S.code), { method: "POST", body: msg })
    .then(r => setRelay(r.ok ? "ok" : r.status === 429 ? "limit" : "err"))
    .catch(() => { setRelay("err"); if (tries > 0) setTimeout(() => send(tries - 1), 4000); });
  send(3);
}
let relayState = "ok";
let relayErrSince = 0;
function setRelay(st) { const changed = relayState !== st; relayState = st; relayErrSince = st === "ok" ? 0 : (relayErrSince || Date.now()); const el = document.getElementById("relay"); if (el) paintRelay(el); if (changed && S && S.phase === "waiting") renderWaitSugs(); }
function paintRelay(el) {
  el.className = "relay " + relayState;
  el.textContent = relayState === "ok" ? "● Sending to leaderboard" : relayState === "limit" ? "● Leaderboard relay busy. Keep playing." : "● Reconnecting to leaderboard…";
}
/* No heartbeat: ntfy.sh keeps 12 hours of messages, so a leaderboard opened late still replays every Fellowship. Fewer posts also keeps a whole classroom (one shared network) under the relay's free daily limit. */

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */

function startGame() {
  S.code = S.code.trim(); S.name = S.name.trim(); S.opp = S.opp.trim();

  if (!S.opp) { S.error = "Enter your opponent's Fellowship."; return renderSetup(); }
  if (S.name.toLowerCase() === S.opp.toLowerCase()) { S.error = "Your opponent needs a different name than yours."; return renderSetup(); }
  if (S.players.some(p => !p.name.trim())) { S.error = "Every player needs a name."; return renderSetup(); }
  S.error = "";
  openCheck();

/* ------------------------------------------------------------------ */
/* NAME CHECK: compare with Fellowships already playing in this class */
/* so both computers spell the matchup the same way.                  */
/* ------------------------------------------------------------------ */
const nameKey = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\b(the|team)\b/g, " ")
  .split(/\s+/).filter(Boolean).map(w => w.length > 3 ? w.replace(/s$/, "") : w).join(" ");
const same = (a, b) => String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
function editDist(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function closeness(a, b) { /* 0 = identical spelling idea; bigger = further apart */
  const x = nameKey(a), y = nameKey(b);
  if (!x || !y) return 99;
  if (x === y) return 0;
  if (x.length > 4 && y.length > 4 && (x.includes(y) || y.includes(x))) return 1;
  const dd = editDist(x, y);
  return dd <= Math.max(2, Math.floor(Math.max(x.length, y.length) * 0.3)) ? 1 + dd : 99;
}
async function fetchClass(code) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(RELAY + topicFor(code) + "/json?poll=1&since=12h", { signal: ctl.signal });
    const latest = {}, hidden = new Set(); let clearedAt = 0;
    (await r.text()).split("\n").forEach(line => {
      try {
        const env = JSON.parse(line); if (env.event && env.event !== "message") return;
        const m = JSON.parse(env.message);
        if (m.clear) { clearedAt = Math.max(clearedAt, Number(m.t) || 0); return; }   /* teacher pressed Clear board */
        if (m.hide) { hidden.add(String(m.hide)); return; }                             /* teacher removed one with ✕ */
        if (!m.id || !m.fs || m.id === S.id) return;
        if (!latest[m.id] || latest[m.id].t < m.t) latest[m.id] = m;
      } catch (e) {}
    });
    const seen = new Set();
    return Object.values(latest).filter(m => m.t >= clearedAt && !hidden.has(m.id)).sort((a, b) => b.t - a.t)
      .map(m => ({ fs: String(m.fs).trim().slice(0, 40), opp: String(m.opp || "").trim().slice(0, 40) }))
      .filter(o => { const k = o.fs.toLowerCase(); if (seen.has(k) || same(o.fs, S.name)) return false; seen.add(k); return true; });
  } catch (e) { return null; } finally { clearTimeout(tm); }
}
async function openCheck() {
  S.phase = "check"; S.check = { loading: true, others: [] };
  save(); render();
  const others = await fetchClass(S.code);
  if (S.phase !== "check") return;
  S.check = { loading: false, offline: others === null, others: others || [] };
  save(); renderSugs();
}
function suggestions() {
  const others = S.check.others;
  const out = { opp: null, name: null, oppOk: false, nameOk: false };
  const oppTeam = others.find(o => same(o.fs, S.opp));
  out.oppOk = !!oppTeam;
  if (!oppTeam) {
    const best = others.map(o => ({ o, c: closeness(o.fs, S.opp) })).filter(x => x.c < 99).sort((a, b) => a.c - b.c)[0];
    if (best) out.opp = best.o.fs;
  }
  /* how did our opponent spell OUR name? */
  const opTeam = oppTeam || others.find(o => out.opp && same(o.fs, out.opp));
  if (opTeam && opTeam.opp) {
    if (same(opTeam.opp, S.name)) out.nameOk = true;
    else if (closeness(opTeam.opp, S.name) < 99) out.name = { spell: opTeam.opp, by: opTeam.fs };
  }
  return out;
}
function renderCheck() {
  document.getElementById("app").innerHTML = `

function renderSugs() {
  const el = document.getElementById("sugs"); if (!el || !S.check) return;
  if (S.check.loading) { el.innerHTML = `<div class="preview">Checking which Fellowships in class <b>${esc(S.code)}</b> have already started…</div>`; return; }

  if (g.oppOk && (g.nameOk || !g.name)) rows.push(`<div class="sug ok">✓ <b>${esc(S.opp)}</b> is already playing, and your names line up. You'll be paired on the leaderboard.</div>`);

      : `<div class="preview"><b>${esc(S.opp)}</b> hasn't started yet. Show them exactly how you spelled both names.</div>`);
  if (others.length) rows.push(`<div class="already"><span class="lbl">Already playing in class ${esc(S.code)} · tap to use as your opponent</span><div class="choices">${others.map(o => `<button type="button" class="choice ${same(o.fs, S.opp) ? "on" : ""}" data-act="useopp" data-val="${esc(o.fs)}">${esc(o.fs)}</button>`).join("")}</div></div>`);

}
function launch() {
  S.name = S.name.trim(); S.opp = S.opp.trim();
  if (!S.name || !S.opp) { S.error = "Both names need to be filled in."; return renderCheck(); }
  if (same(S.name, S.opp)) { S.error = "Your opponent needs a different name than yours."; return renderCheck(); }
  S.error = ""; delete S.check;
  S.players.forEach(p => { p.name = p.name.trim(); });
  Object.assign(S, { phase: "waiting", readyAt: Date.now(), mission: missionOf(), result: null, shield: 0, defendIdx: 0,
    stats: { answered: 0, correct: 0 }, b0: S.players.filter(p => p.status === "fire").length, log: [], announced: false });
  S.last = `${S.name} lit their fire and is waiting for ${S.opp}.`;
  save(); render(); broadcast(); watchReady();
}

/* ------------------------------------------------------------------ */
/* WAITING ROOM: both Fellowships in a matchup must light their fire  */
/* (with matching names) before either game starts.                   */
/* ------------------------------------------------------------------ */
let readyES = null, waitingOthers = {}, readyClearedAt = 0;
function stopReady() { if (readyES) { readyES.close(); readyES = null; } }
const isPartner = m => closeness(m.fs, S.opp) < 99 && closeness(m.opp, S.name) < 99;
function watchReady() {
  stopReady(); waitingOthers = {}; readyClearedAt = 0;
  if (!S || S.phase !== "waiting" || typeof EventSource === "undefined") return;
  const since = Math.floor(Date.now() / 1000) - 30 * 60;   /* a partner who got ready in the last 30 minutes */
  readyES = new EventSource(RELAY + topicFor(S.code) + "/sse?since=" + since);
  readyES.onopen = () => setRelay("ok");
  readyES.onerror = () => setRelay("err");
  readyES.onmessage = e => {
    try {
      const env = JSON.parse(e.data); if (env.event && env.event !== "message") return;
      const m = JSON.parse(env.message);
      if (m.clear) { readyClearedAt = Math.max(readyClearedAt, Number(m.t) || 0); Object.keys(waitingOthers).forEach(id => { if (waitingOthers[id].t < readyClearedAt) delete waitingOthers[id]; }); return renderWaitSugs(); }
      if (m.hide) { delete waitingOthers[m.hide]; return renderWaitSugs(); }
      if (!m.id || m.id === S.id || !m.fs || m.result || m.t < readyClearedAt) return;
      if (m.ready) waitingOthers[m.id] = { fs: String(m.fs).slice(0, 40), opp: String(m.opp || "").slice(0, 40), t: m.t };
      else delete waitingOthers[m.id];
      if (m.ready && isPartner(m)) return partnerReady(m);
      renderWaitSugs();
    } catch (err) {}
  };
}
function partnerReady(m) {
  if (S.phase !== "waiting") return;
  stopReady();
  S.partner = String(m.fs).slice(0, 40);
  startPlay();
}
function leaveWaiting() {   /* back to the name check; the old waiting entry leaves the leaderboard */
  stopReady();
  fetch(RELAY + topicFor(S.code), { method: "POST", body: JSON.stringify({ hide: S.id, t: Date.now() }) }).catch(() => {});
  S.id = newId(); S.phase = "setup"; save(); openCheck();
}
function renderWaiting() {
  document.getElementById("app").innerHTML = `
    ${topBar(true)}
    <section class="fs-card solo waitroom" aria-label="Waiting for your opponent">
      <div class="campfire" aria-hidden="true"><i></i><i></i><i></i></div>
      <h2>Your fire is lit. Waiting for <span class="opp">${esc(S.opp)}</span>…</h2>
      <p class="intro" style="margin:0">Your game starts the moment <b>${esc(S.opp)}</b> clicks “Light our fire” on their computer with your name, <b>${esc(S.name)}</b>, as their opponent. Both games start together.</p>
      <div class="preview">${previewText()}</div>
      <div id="waitsugs" aria-live="polite"></div>
      <div class="setup-foot">
        <button type="button" class="btn" data-act="unwait">← Fix our names</button>
        <span style="flex:1"></span>
      </div>
    </section>`;
  const r = document.getElementById("relay"); if (r) paintRelay(r);
  renderWaitSugs();
}
function renderWaitSugs() {
  const el = document.getElementById("waitsugs"); if (!el || S.phase !== "waiting") return;
  const others = Object.values(waitingOthers).filter(o => !same(o.fs, S.name));
  const wantUs = others.filter(o => closeness(o.opp, S.name) < 99 && closeness(o.fs, S.opp) >= 99);
  const rows = wantUs.map(o => `<div class="sug"><span><b>${esc(o.fs)}</b> is waiting and says they're playing <b>you</b>. Is that your opponent?</span><button type="button" class="btn small" data-act="playthem" data-val="${esc(o.fs)}">Play ${esc(o.fs)}</button></div>`);
  if (others.length) rows.push(`<div class="already"><span class="lbl">Also waiting in class ${esc(S.code)}</span><div class="choices">${others.map(o => `<span class="choice">${esc(o.fs)} <small>vs ${esc(o.opp)}</small></span>`).join("")}</div></div>`);
  if (relayErrSince && Date.now() - relayErrSince > 30000) rows.push(`<div class="sug"><span>Can't reach the leaderboard right now. If it doesn't come back, your teacher can let you start without waiting.</span><button type="button" class="btn small" data-act="startanyway">Start without waiting</button></div>`);
  el.innerHTML = rows.join("");
}

setInterval(() => { if (S && S.phase === "waiting") renderWaitSugs(); }, 5000);

function startPlay() {
  const piles = { EMBER: [], FLAME: [], INFERNO: [] };
  CARDS.forEach(c => piles[c.tier].push(c.id));
  EVENTS.forEach(e => piles.EMBER.push(e));
  Object.values(piles).forEach(shuffle);
  S.players.forEach(p => { p.name = p.name.trim(); p.singed = 0; p.answered = false; });
  Object.assign(S, { piles, phase: "play", announced: false, startedAt: Date.now(), resultAt: 0, endBy: "", log: [], mission: missionOf(), result: null, shield: 0, defendIdx: 0, stats: { answered: 0, correct: 0 }, b0: S.players.filter(p => p.status === "fire").length });
  watchOpponent();
  log(`${S.name} vs ${S.partner || S.opp}: the game is on! ${S.mission === "rescue" ? `Rescuing ${inFire().length}` : "Defending the camp"}.`);
  beginTurn();
}

/* ------------------------------------------------------------------ */
/* TURN ENGINE                                                         */
/* ------------------------------------------------------------------ */
function eligiblePlayers() {
  const camp = idxWhere(p => p.status === "camp" && !(p.singed > 0));
  if (S.mission === "defend") { const fresh = camp.filter(i => !S.players[i].answered); return fresh.length ? fresh : camp; }
  return camp;
}
function finish() {
  if (!S.resultAt) S.resultAt = Date.now();
  if (!S.endBy) S.endBy = "self";
  S.phase = "over"; document.getElementById("modal-root").innerHTML = "";
  save(); broadcast(); render();
  if (S.oppFinal) stopWatching(); else if (!oppES) watchOpponent();
}

/* ------------------------------------------------------------------ */
/* MATCHUP: listen for our opponent's final score. When both have    */
/* finished 5 cards, more players safe wins.                          */
/* ------------------------------------------------------------------ */
let oppES = null;
function stopWatching() { if (oppES) { oppES.close(); oppES = null; } }
function watchOpponent() {
  stopWatching();
  if (!S || (S.phase !== "play" && S.phase !== "over") || S.oppFinal || !S.code || !S.startedAt || typeof EventSource === "undefined") return;
  oppES = new EventSource(RELAY + topicFor(S.code) + "/sse?since=" + Math.floor(S.startedAt / 1000));
  oppES.onmessage = e => {
    try {
      const env = JSON.parse(e.data); if (env.event && env.event !== "message") return;
      const m = JSON.parse(env.message);
      if (!m.id || m.id === S.id || !m.fs || m.result !== "done" || !m.rt || !Array.isArray(m.p)) return;
      if (m.rt < S.startedAt) return;                                  /* an old game from earlier */
      if (closeness(m.fs, S.opp) >= 99) return;                        /* not our opponent */
      if (m.opp && closeness(m.opp, S.name) >= 99) return;
      opponentFinished(m);
    } catch (err) {}
  };
}
function opponentFinished(m) {
  if (S.oppFinal) return;
  S.oppFinal = { fs: String(m.fs).slice(0, 40), safe: m.p.filter(x => !x[1]).length, total: m.p.length, ok: Number(m.ok) || 0, rt: Number(m.rt) };
  log(`${S.oppFinal.fs} finished with ${S.oppFinal.safe} of ${S.oppFinal.total} safe.`);
  save();
  if (S.phase === "over") { stopWatching(); render(); }
}
/* 1 = we win, -1 = they win, 0 = tie. More safe (as a share of the team), then more safe, then more correct, then finished first. */
function compareFinal(a, b) {
  return Math.sign(a.safe / a.total - b.safe / b.total) || Math.sign(a.safe - b.safe) || Math.sign(a.ok - b.ok) || Math.sign(b.rt - a.rt);
}

function beginTurn() {
  clearInterval(timerHandle);
  if (S.result) return finish();
  S.players.forEach(p => { if (p.singed > 0) p.singed--; });
  if (S.mission === "rescue" && !["EMBER", "FLAME", "INFERNO"].some(k => S.piles[k].length)) {
    S.result = "done"; log(`The cards ran out. ${S.name} finished with ${inCamp().length} of ${S.players.length} safe.`); return finish();
  }
  let eligible = eligiblePlayers(), lastStand = false;
  if (!eligible.length && inCamp().length === 0) { eligible = idxWhere(p => p.status === "fire"); lastStand = true; }
  if (!eligible.length) {
    S.turn = { stage: "skip", eligible: [], moves: [] };
    save(); return render();
  }
  S.turn = { stage: "choose", eligible, lastStand, answerer: eligible.length === 1 ? eligible[0] : null, tier: S.mission === "defend" ? DEFEND_ORDER[S.defendIdx] : null, moves: [] };
  if (!S.announced) { S.announced = true; save(); broadcast(); }
  save(); render();
}

function drawCard() {
  let tier = S.turn.tier;
  if (!S.piles[tier].length) {
    const alt = ["EMBER", "FLAME", "INFERNO"].find(k => S.piles[k].length);
    if (!alt) { S.result = "done"; log("The cards ran out."); return finish(); }
    tier = alt; S.turn.tier = alt;
  }
  const item = S.piles[tier].shift();
  if (typeof item === "string") {
    S.turn.stage = "event"; S.turn.event = item;
    log(`${S.name} drew ${item === "FLARE" ? "a Flare-Up!" : "the Bucket Brigade"}`);
  } else {
    Object.assign(S.turn, { stage: "card", cardId: item, flare: false, started: Date.now(), limit: 120 });
  }
  save(); render();
}

function startFlare() {
  if (!S.piles.FLAME.length) { log("No Flame cards left, so the flare-up fizzles."); return backToChoose(); }
  S.turn.flareReturn = { tier: S.turn.tier, answerer: S.turn.answerer };
  Object.assign(S.turn, { stage: "card", cardId: S.piles.FLAME.shift(), flare: true, started: Date.now(), limit: 60 });
  save(); render();
}

function parseC(raw) {
  if (raw == null) return NaN;
  const s = String(raw).trim().toLowerCase().replace(/[−–—]/g, "-").replace(/\s+/g, "").replace(/^c=/, "");
  if (!s) return NaN;
  if (/^[-+]?\d+(\.\d+)?\/[-+]?\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split("/").map(Number); return b ? a / b : NaN; }
  if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}
const sameC = (x, C) => Number.isFinite(x) && Math.abs(x - C) < 0.006;   /* lets 35/6 be typed as 5.83 */
const fmtC = C => { const sign = C < 0 ? "−" : ""; const a = Math.abs(C); return sign + (Number.isInteger(a) ? a : Number.isInteger(a * 2) ? `${a * 2}/2` : a); };

function move(i, to) {
  const p = S.players[i], from = p.status;
  if (to === "fire" && S.shield > 0) {
    S.shield--;
    S.turn.moves.push(`<b>Fire Shield!</b> It blocks the fire. <b>${esc(p.name)}</b> stays in ${campName()}.`);
    S.log.push(`Fire Shield saved ${p.name}.`);
    return;
  }
  p.status = to;
  if (to === "fire") p.singed = 0;
  const w = st => st === "fire" ? "The Fire" : campName();
  S.turn.moves.push(`<b>${esc(p.name)}</b>: ${w(from)} → ${w(to)}`);
  S.log.push(`${p.name}: ${w(from)} → ${w(to)}`);
}
function singe(i) {
  const p = S.players[i]; p.singed = 2;
  S.turn.moves.push(`<b>${esc(p.name)}</b> is singed. Lay the piece on its side; it sits out your next turn.`);
  S.log.push(`${p.name} is singed.`);
}

async function resolve(raw, timeout) {
  if (!S.turn || S.turn.stage !== "card") return;   /* already checked (timer and button can't both count) */
  S.turn.stage = "checking";
  clearInterval(timerHandle);
  const c = card(S.turn.cardId), a = S.turn.answerer, ap = S.players[a];
  const correct = !timeout && (sameC(parseC(raw), c.C) || (c.alt && sameC(parseC(raw), c.alt.C)));
  Object.assign(S.turn, { correct, timeout, raw });
  S.stats.answered++; if (correct) S.stats.correct++;
  const before = inFire().length;

  if (S.turn.flare) {
    if (!correct) {
      const camp = idxWhere(p => p.status === "camp");
      if (camp.length) (await choosePlayers(camp, 1, `Flare-up missed! ${S.opp}, choose one of ${S.name}'s players to pull into the fire.`, true)).forEach(i => move(i, "fire"));
    } else {
      const fire = idxWhere(p => p.status === "fire");
      if (fire.length) (fire.length === 1 ? fire : await choosePlayers(fire, 1, "Flare-up beaten! Choose 1 player to pull out of the fire.")).forEach(i => move(i, "camp"));
      else { S.shield = (S.shield || 0) + 1; S.turn.moves.push(`Nobody is in your fire, so you earn a <b>Fire Shield</b>. It blocks the next player who would go into the fire.`); S.log.push(`${S.name} earned a Fire Shield.`); }
    }
  } else if (S.mission === "rescue") {
    if (correct) {
      const pay = RESCUE_PAY[c.tier];
      if (S.turn.lastStand) move(a, "camp");
      const fire = idxWhere(p => p.status === "fire");
      if (fire.length) (fire.length <= pay ? fire : await choosePlayers(fire, pay, `Choose ${pay} player${pay > 1 ? "s" : ""} to pull out of the fire.`)).forEach(i => move(i, "camp"));
    } else if (!S.turn.lastStand) {
      if (c.tier === "INFERNO") move(a, "fire"); else singe(a);
    }
  } else {
    ap.answered = true;
    if (S.turn.lastStand) { if (correct) move(a, "camp"); }   /* answered from the fire: right = climbs out, miss = stays */
    if (correct) {
      if (c.tier === "INFERNO") { const fire = idxWhere(p => p.status === "fire"); if (fire.length) (fire.length === 1 ? fire : await choosePlayers(fire, 1, "Choose 1 player to pull out of the fire.")).forEach(i => move(i, "camp")); }
    } else if (!S.turn.lastStand) {
      move(a, "fire");
      if (c.tier === "INFERNO") { const camp = idxWhere(p => p.status === "camp").filter(i => i !== a); if (camp.length) (camp.length === 1 ? camp : await choosePlayers(camp, 1, `${S.opp}, choose one more of ${S.name}'s players to pull into the fire.`, true)).forEach(i => move(i, "fire")); }
    }
  }
  if (!S.turn.flare) S.defendIdx++;   /* counts the 5 problem cards for every mission */
  const after = inFire().length;
  const verdict = correct ? "solved" : timeout ? "ran out of time on" : "missed";
  const delta = after < before ? `, rescued ${before - after}` : after > before ? `, ${after - before} fell in` : "";
  log(`${ap.name} ${verdict} ${S.turn.flare ? "a Flare-Up" : `an ${c.tier === "EMBER" ? "Ember" : c.tier === "FLAME" ? "Flame" : "Inferno"}`} card${delta}.`.replace("an Flame", "a Flame"));
  checkMission();
  S.turn.stage = S.turn.flare ? "flareResult" : "result";
  save(); broadcast(); render();
}

function checkMission() {
  if (S.result) return;
  if (S.defendIdx >= CARDS_PER_GAME) { S.result = "done"; log(`${S.name} finished all 5 cards with ${inCamp().length} of ${S.players.length} safe.`); }
  if (S.result && !S.resultAt) { S.resultAt = Date.now(); S.endBy = "self"; } /* stamp now so the opponent sees our final score right away */
}

async function bucket() {
  const fire = idxWhere(p => p.status === "fire");
  if (fire.length) (fire.length === 1 ? fire : await choosePlayers(fire, 1, "Choose 1 player to pull out of the fire.")).forEach(i => move(i, "camp"));
  else S.turn.moves.push("Nobody is in your fire, so the bucket has nothing to put out.");
  log(`${S.name} used the Bucket Brigade.`);
  checkMission();
  S.turn.stage = "eventDone";
  save(); broadcast(); render();
}

function backToChoose() {
  if (S.result) return finish();
  const keepTier = S.turn.flareReturn ? S.turn.flareReturn.tier : S.turn.tier;
  const prevAns = S.turn.flareReturn ? S.turn.flareReturn.answerer : S.turn.answerer;
  let eligible = eligiblePlayers(), lastStand = false;
  if (!eligible.length && inCamp().length === 0) { eligible = idxWhere(p => p.status === "fire"); lastStand = true; }
  if (!eligible.length) return beginTurn();
  S.turn = { stage: "choose", eligible, lastStand, answerer: eligible.includes(prevAns) ? prevAns : (eligible.length === 1 ? eligible[0] : null), tier: S.mission === "defend" ? DEFEND_ORDER[S.defendIdx] : keepTier, moves: [], drawAgain: true };
  save(); render();
}

/* ------------------------------------------------------------------ */
/* PICK-PLAYERS MODAL                                                  */
/* ------------------------------------------------------------------ */
function choosePlayers(options, count, title, oppPicks) {
  return new Promise(res => {
    const sel = new Set(), root = document.getElementById("modal-root");
    const draw = () => {
      root.innerHTML = `<div class="modal-back" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal">
        ${oppPicks ? `<div class="handoff">Show <b>${esc(S.opp)}</b> your screen so they can pick who goes into the fire.</div>` : ""}
        <h3 id="mt">${esc(title)}</h3><p>Pick ${count}. Selected: ${sel.size} of ${count}</p>
        <div class="choices">${options.map(i => `<button type="button" class="choice ${sel.has(i) ? "on" : ""}" data-i="${i}">${esc(S.players[i].name)}</button>`).join("")}</div>
        <div class="actions"><button type="button" class="btn primary" id="mok" ${sel.size === count ? "" : "disabled"}>Confirm</button></div></div></div>`;
      root.querySelectorAll(".choice").forEach(b => b.onclick = () => {
        const i = Number(b.dataset.i);
        if (sel.has(i)) sel.delete(i); else if (sel.size < count) sel.add(i);
        draw(); const again = root.querySelector(`.choice[data-i="${i}"]`); if (again) again.focus();
      });
      root.querySelector("#mok").onclick = () => { root.innerHTML = ""; res([...sel]); };
    };
    draw();
    const first = root.querySelector(".choice"); if (first) first.focus();
  });
}

/* RENDER                                                              */
/* ------------------------------------------------------------------ */
function topBar(inGame) {
  return `<header class="top">
    <h1>The <span>+C</span> Rescue</h1>
    <span class="tag">${inGame ? `${esc(S.name)} <span class="vs">vs</span> ${esc(S.opp)} · class ${esc(S.code)}` : "Antiderivative follow-up game"}</span>
    <span class="spacer"></span>
    ${inGame ? `<span class="relay ok" id="relay" aria-live="polite"></span><button type="button" class="btn small quiet" data-act="reset">New game</button>` : `<button type="button" class="btn small quiet" data-act="clearform">Clear all boxes</button>`}
  </header>`;
}

const cardNo = () => Math.min(CARDS_PER_GAME, (S.turn && S.turn.stage === "result" ? S.defendIdx : S.defendIdx + 1));
function teamPanel() {
  const fire = S.players.filter(p => p.status === "fire"), camp = S.players.filter(p => p.status === "camp");
  const status = S.result ? `<span class="pill won">Finished · ${camp.length} of ${S.players.length} safe</span>` : `<span class="pill ${S.mission}">${S.mission === "rescue" ? "Rescue" : "Defend the Camp"}</span>`;
  const progress = `Card ${cardNo()} of ${CARDS_PER_GAME} · ${fire.length} in the fire`;
  return `<aside class="team active" aria-label="${esc(S.name)}">
    <h3>${esc(S.name)}</h3>
    <div class="meta">${S.lost ? "Lost" : "Won"} the tug-of-war vs ${esc(S.opp)} · ${campName()}</div>
    ${status}
    <div class="meta" style="margin-top:6px">${S.result ? "" : progress}</div>
    <div class="zone-title">In Camp</div>
    <div class="plist">${camp.length ? camp.map(p => `<span class="chip ${p.singed > 0 ? "singed" : "camp"} ${S.mission === "defend" && p.answered ? "done" : ""}">${esc(p.name)}${p.singed > 0 ? " · singed" : ""}${S.mission === "defend" && p.answered ? " ✓" : ""}</span>`).join("") : `<span class="empty">Camp is empty</span>`}</div>
    <div class="zone-title">In the fire</div>
    <div class="plist">${fire.length ? fire.map(p => `<span class="chip fire">${esc(p.name)}</span>`).join("") : `<span class="empty">Nobody</span>`}</div>
    <div class="firebar" aria-hidden="true">${S.players.map(p => `<i class="${p.status === "fire" ? "f" : ""}"></i>`).join("")}</div>
    ${S.shield > 0 ? `<div class="shield">🛡 Fire Shield${S.shield > 1 ? ` ×${S.shield}` : ""}: blocks the next player who would go into the fire</div>` : ""}
    <div class="meta" style="margin-top:10px">${S.stats.correct} of ${S.stats.answered} cards correct</div>
  </aside>`;
}

function cardHTML(c) {
  return `<div class="card ${c.tier}c">
    <div class="band"><span>${c.tier}</span><span>Card ${c.id}</span></div>
    <div class="body"><div class="q ${c.long ? "long" : ""}">${c.q}</div><div class="g">${c.g}</div></div>
    <div class="foot">${S.turn.flare ? "Flare-up: solve as a team in 60 seconds. Right: pull 1 player out of the fire (or earn a Fire Shield). Miss: your opponent pulls one of you in." : TIER_NOTE[S.mission][c.tier]}</div>
  </div>`;
}
function movesHTML() {
  if (!S.turn.moves.length) return `<div class="moves"><h4>Your board</h4><ul><li>No pieces move this time.</li></ul></div>`;
  return `<div class="moves"><h4>Move these pieces on your board</h4><ul>${S.turn.moves.map(m => `<li>${m}</li>`).join("")}</ul></div>`;
}

function stageHTML() {
  const tr = S.turn;
  const head = `<h2>${esc(S.name)}'s turn</h2><p class="sub">${S.mission === "rescue" ? "Rescue Mode" : "Defend the Camp"} · <b>card ${cardNo()} of ${CARDS_PER_GAME}</b> · vs ${esc(S.opp)}</p>`;
  if (tr.stage === "skip") return `${head}<p>Everyone in your Camp is singed, so you sit this turn out. Stand the pieces back up.</p><div class="actions"><button type="button" class="btn primary" data-act="next">Next turn</button></div>`;

  if (tr.stage === "choose") {
    const players = tr.eligible.map(i => `<button type="button" class="choice ${tr.answerer === i ? "on" : ""}" data-act="ans" data-i="${i}">${esc(S.players[i].name)}</button>`).join("");
    const piles = S.mission === "rescue"
      ? `<div class="piles">${["EMBER", "FLAME", "INFERNO"].map(k => `<button type="button" class="pile ${k} ${tr.tier === k ? "on" : ""}" data-act="tier" data-k="${k}" ${S.piles[k].length ? "" : "disabled"}><span class="t">${k}</span><span class="r">${TIER_NOTE.rescue[k]}</span><span class="r">${S.piles[k].length} left</span></button>`).join("")}</div>`
      : `<div class="piles"><div class="pile ${tr.tier} on"><span class="t">${tr.tier}</span><span class="r">${TIER_NOTE.defend[tr.tier]}</span><span class="r">Order: ${DEFEND_ORDER.map((d, k) => k === S.defendIdx ? `<b>${d}</b>` : d).join(" · ")}</span></div></div>`;
    return `${head}
      ${tr.drawAgain ? `<p><b>Draw again.</b> Event cards don't use up your turn.</p>` : ""}
      ${tr.lastStand ? `<p><b>Last Stand!</b> Your Camp is empty, so a player answers from the edge of the fire. Get it right and they climb out, plus the card's payoff. Miss and they stay put.</p>` : ""}
      <div class="step-lbl">${tr.lastStand ? "Who makes the Last Stand?" : "Who answers?"}</div>
      <div class="choices">${players}</div>
      <div class="step-lbl">${S.mission === "rescue" ? "Pick a pile" : "Your card comes from"}</div>
      ${piles}
      <div class="actions"><button type="button" class="btn primary" data-act="draw" ${tr.answerer != null && tr.tier ? "" : "disabled"}>Draw the card</button></div>`;
  }

  if (tr.stage === "event") {
    if (tr.event === "FLARE") return `${head}<div class="event flare"><div class="big">Flare-Up!</div><p>The fire jumps. Your whole Fellowship solves a Flame card <b>together in 60 seconds</b>.</p><p><b>Get it right:</b> pull 1 player out of the fire. If nobody is in it, you earn a <b>Fire Shield</b> that blocks the next player who would go in.<br><b>Miss it:</b> ${esc(S.opp)} pulls one of your Camp players into the fire.</p></div><div class="actions"><button type="button" class="btn primary" data-act="flare">Draw the Flame card</button></div>`;
    return `${head}<div class="event bucket"><div class="big">Bucket Brigade</div><p>Free rescue! To claim it, the whole Fellowship says out loud:</p><p style="font-family:var(--math);font-size:24px">“The antiderivative of xⁿ is xⁿ⁺¹⁄(n+1) + C, for n ≠ −1.”</p></div><div class="actions"><button type="button" class="btn primary" data-act="bucket">We said it</button></div>`;
  }
  if (tr.stage === "eventDone") return `${head}<div class="event bucket"><div class="big">Bucket Brigade</div></div>${movesHTML()}<div class="actions"><button type="button" class="btn primary" data-act="again">Draw again</button></div>`;

  if (tr.stage === "card") {
    const c = card(tr.cardId), ap = S.players[tr.answerer];
    return `${head}
      <p><b>${esc(ap.name)}</b>${tr.flare ? " and the whole Fellowship" : ""} ${tr.lastStand && !tr.flare ? "makes a Last Stand on" : "answer" + (tr.flare ? "" : "s")}:</p>
      ${cardHTML(c)}
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="timer" id="timer" role="timer">--:--</span><span class="hint">Show all four steps on the whiteboard</span></div>
      <div class="steps4"><div>1. Integrate. Write <b>+C</b>!</div><div>2. Plug in the point</div><div>3. Solve for C</div><div>4. Write the finished function</div></div>
      <div class="ansbox"><label class="lbl" for="aC">C =</label><input type="text" id="aC" inputmode="decimal" autocomplete="off" placeholder="e.g. 4, −3, 5/2"><div class="hint">Fractions and decimals both work.</div></div>
      <div class="actions">
        <button type="button" class="btn primary" data-act="submit">Check the answer</button>
      </div>`;
  }

  if (tr.stage === "result" || tr.stage === "flareResult") {
    const c = card(tr.cardId);
    const why = tr.timeout ? "Out of time." : tr.correct ? "" : `You said C = ${esc(tr.raw || "nothing")}.`;
    const back = tr.stage === "flareResult" && !S.result;
    return `${head}
      <p class="verdict ${tr.correct ? "good" : "bad"}">${tr.correct ? (tr.flare ? "Flare-up beaten!" : "Correct!") : "Miss."}</p>
      ${why ? `<p>${why}</p>` : ""}
      <div class="reveal">${c.alt ? `By ${c.how}: ` : ""}${c.f} &nbsp;&nbsp;<b>C = ${fmtC(c.C)}</b>${c.alt ? `<br>By ${c.alt.how}: ${c.alt.f} &nbsp;&nbsp;<b>C = ${c.alt.show}</b><br><small>Both are right. The two antiderivatives differ by 1/6, so their C values differ too.</small>` : ""}</div>
      ${movesHTML()}
      ${S.result ? `<p><b>That was your 5th card! You finished with ${inCamp().length} of ${S.players.length} safe.</b></p>` : ""}
      <div class="actions"><button type="button" class="btn primary" data-act="${back ? "again" : "next"}">${back ? "Back to your turn" : S.result ? "See the results" : "Next turn"}</button></div>`;
  }
  return head;
}

function renderPlay() {
  document.getElementById("app").innerHTML = `${topBar(true)}
    <div class="table solo">
      ${teamPanel()}
      <section class="stage" aria-live="polite">${stageHTML()}</section>
    </div>
    <details class="log"><summary>Game log (${S.log.length})</summary><ol>${S.log.map(l => `<li>${esc(l)}</li>`).join("")}</ol></details>`;
  const r = document.getElementById("relay"); if (r) paintRelay(r);
  if (S.turn && S.turn.stage === "card") startTimer();
}

function overTitle() {
  if (!S.oppFinal) return `All 5 cards done: ${inCamp().length} of ${S.players.length} safe`;
  const r = compareFinal(myFinal(), S.oppFinal);
  return r > 0 ? "You win the matchup!" : r < 0 ? `${esc(S.oppFinal.fs)} wins the matchup` : "It's a tie!";
}
function overLine() {
  const o = S.oppFinal, me = myFinal();
  if (!o) return `Waiting for ${esc(S.opp)} to finish their 5 cards… Keep this screen open to see who wins.`;
  const r = compareFinal(me, o);
  const score = `${esc(S.name)}: ${me.safe} of ${me.total} safe · ${esc(o.fs)}: ${o.safe} of ${o.total} safe`;
  const why = me.safe / me.total !== o.safe / o.total || me.safe !== o.safe ? "" : me.ok !== o.ok ? " Same number safe, so it came down to correct answers." : r !== 0 ? " Same number safe and correct, so the faster Fellowship wins." : "";
  return score + "." + why;
}
const myFinal = () => ({ safe: inCamp().length, total: S.players.length, ok: S.stats.correct, rt: S.resultAt || Date.now() });
function renderOver() {
  document.getElementById("app").innerHTML = `${topBar(true)}
    <section class="stage over">
      <h2>${overTitle()}</h2>
      <p class="verdict ${!S.oppFinal ? "" : compareFinal(myFinal(), S.oppFinal) >= 0 ? "good" : "bad"}" style="font-size:22px">${overLine()}</p>
      <p class="sub">${esc(S.name)} · ${S.mission === "rescue" ? "Rescue Mode" : "Defend the Camp"} · vs ${esc(S.opp)}</p>
      <div class="res">
        <div><h3>${inCamp().length} of ${S.players.length}</h3><p>safe in Camp</p></div>
        <div><h3>${S.stats.correct} of ${S.stats.answered}</h3><p>cards correct</p></div>
      </div>
      <p>Check the leaderboard to see how every Fellowship is doing.</p>
      <div class="actions" style="justify-content:center"><button type="button" class="btn primary" data-act="reset">Play again</button></div>
    </section>
    <details class="log" open><summary>Game log (${S.log.length})</summary><ol>${S.log.map(l => `<li>${esc(l)}</li>`).join("")}</ol></details>`;
  const r = document.getElementById("relay"); if (r) paintRelay(r);
}

function render() {
  clearInterval(timerHandle);
  if (S.phase === "setup") renderSetup(); else if (S.phase === "check") renderCheck(); else if (S.phase === "waiting") renderWaiting(); else if (S.phase === "play") renderPlay(); else renderOver();
}

function startTimer() {
  const el = document.getElementById("timer");
  const tick = () => {
    const left = Math.max(0, S.turn.limit - Math.floor((Date.now() - S.turn.started) / 1000));
    el.textContent = left ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "Time!";
    el.classList.toggle("out", left === 0);
    if (left === 0 && S.turn.stage === "card") {
      const box = document.getElementById("aC"); if (box) box.disabled = true;
      const btn = document.querySelector('[data-act="submit"]'); if (btn) btn.disabled = true;
      clearInterval(timerHandle);
      setTimeout(() => resolve("", true), 900);   /* a moment to see "Time!" */
    }
  };
  tick(); timerHandle = setInterval(tick, 500);
}

/* ------------------------------------------------------------------ */
/* EVENTS                                                              */
/* ------------------------------------------------------------------ */
document.addEventListener("input", e => {
  if (!S || (S.phase !== "setup" && S.phase !== "check")) return;
  const el = e.target, f = el.dataset.field;
  if (S.phase === "check") { if (f === "name") S.name = el.value; if (f === "opp") S.opp = el.value; save(); renderSugs(); return; }
  if (f === "code") S.code = el.value;
  if (f === "name") S.name = el.value;
  if (f === "opp") S.opp = el.value;
  if (f === "pname") S.players[el.dataset.p].name = el.value;
  save();
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && S && S.phase === "play" && S.turn && S.turn.stage === "card" && e.target.id === "aC") { e.preventDefault(); document.querySelector('[data-act="submit"]').click(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "reset") {
    if (b.dataset.armed === "1" || S.phase === "over") { stopWatching(); stopReady(); S = freshSetup(); save(); return render(); }
    b.dataset.armed = "1"; b.textContent = "Click again to start over";
    setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "New game"; } }, 4000); return;
  }
  if (S.phase === "waiting") {
    if (act === "unwait") return leaveWaiting();
    if (act === "playthem") { S.opp = b.dataset.val; S.last = `${S.name} lit their fire and is waiting for ${S.opp}.`; save(); renderWaiting(); broadcast();
      const hit = Object.values(waitingOthers).find(o => same(o.fs, S.opp) && isPartner(o)); if (hit) partnerReady(hit); return; }
    if (act === "startanyway") { stopReady(); return startPlay(); }
    return;
  }
  if (S.phase === "check") {
    if (act === "clearform") { S = freshSetup(); save(); return render(); }
    if (act === "back") { S.phase = "setup"; delete S.check; S.error = ""; save(); return render(); }
    if (act === "useopp") { S.opp = b.dataset.val; document.getElementById("oname").value = S.opp; save(); return renderSugs(); }
    if (act === "usename") { S.name = b.dataset.val; document.getElementById("fname").value = S.name; save(); return renderSugs(); }
    if (act === "launch") return launch();
    return;
  }
  if (S.phase === "setup") {
    if (act === "clearform") { S = freshSetup(); save(); renderSetup(); document.getElementById("code").focus(); return; }
    if (act === "result") S.lost = b.dataset.val === "lost";
    if (act === "pstat") S.players[b.dataset.p].status = b.dataset.val;
    if (act === "add" && S.players.length < 8) S.players.push({ name: "", status: "camp" });
    if (act === "del" && S.players.length > 1) S.players.splice(Number(b.dataset.p), 1);
    if (act === "start") return startGame();
    save(); renderSetup();
    const again = document.querySelector(`[data-act="${act}"]${b.dataset.p != null && act !== "del" ? `[data-p="${b.dataset.p}"]` : ""}${b.dataset.val ? `[data-val="${b.dataset.val}"]` : ""}`);
    if (again) again.focus();
    return;
  }
  if (S.phase !== "play") return;
  if (act === "ans") { S.turn.answerer = Number(b.dataset.i); save(); return render(); }
  if (act === "tier") { S.turn.tier = b.dataset.k; save(); return render(); }
  if (act === "draw") return drawCard();
  if (act === "flare") return startFlare();
  if (act === "bucket") return bucket();
  if (act === "again") return backToChoose();
  if (act === "next") return beginTurn();
  if (act === "submit") {
    const a = document.getElementById("aC").value;
    if (!a.trim()) { document.getElementById("aC").focus(); return; }
    return resolve(a, false);
  }
});

/* boot */
S = load() || freshSetup();
if (S.phase === "play" && S.turn && S.turn.stage === "checking") S.turn.stage = "card";   /* reloaded mid-check */
if (S.phase === "play" && S.turn && S.turn.stage === "card" && !S.turn.started) S.turn.started = Date.now();
render();
if (S.phase === "check") openCheck();
if (S.phase === "play" || (S.phase === "over" && !S.oppFinal)) watchOpponent();
if (S.phase === "waiting") watchReady();
broadcast();
</script>
</body>
